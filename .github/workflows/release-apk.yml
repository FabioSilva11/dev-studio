name: Build APK Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release-apk:
    name: Build and publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android local properties
        shell: bash
        run: |
          FLUTTER_BIN="$(command -v flutter)"
          FLUTTER_SDK="$(dirname "$(dirname "$FLUTTER_BIN")")"
          VERSION_LINE="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          VERSION_NAME="${VERSION_LINE%%+*}"
          VERSION_CODE="${VERSION_LINE#*+}"
          if [ "$VERSION_CODE" = "$VERSION_LINE" ]; then
            VERSION_CODE="1"
          fi
          {
            echo "sdk.dir=${ANDROID_HOME}"
            echo "flutter.sdk=${FLUTTER_SDK}"
            echo "flutter.buildMode=release"
            echo "flutter.versionName=${VERSION_NAME}"
            echo "flutter.versionCode=${VERSION_CODE}"
          } > android/local.properties
          echo "APP_VERSION=${VERSION_NAME}-${VERSION_CODE}" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: flutter pub get

      - name: Build ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk "release/Dev-Studio-${APP_VERSION}-arm64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dev-Studio-${{ env.APP_VERSION }}-arm64
          path: release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-studio-${{ env.APP_VERSION }}-${{ github.run_number }}
          name: Dev Studio ${{ env.APP_VERSION }} build ${{ github.run_number }}
          body: APK Android arm64 gerado automaticamente pela branch main.
          files: release/*.apk
