name: dev_studio
description: "Dev Studio - ambiente de desenvolvimento inspirado no Sketchware."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  firebase_core: ^4.1.0
  firebase_auth: ^6.0.2
  auto_injector: ^2.1.1
  go_router: ^17.2.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  uuid: ^4.5.1
  google_fonts: ^8.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

